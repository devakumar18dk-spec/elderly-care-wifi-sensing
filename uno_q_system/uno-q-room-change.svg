<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>A moved wardrobe shifts CSI and the UNO Q asks the caretaker to verify</title>
<desc>Animated top view of a room. A wardrobe slides into a new position, the Wi-Fi links between the three ESP32 boards change colour, the UNO Q reports persistent drift and the caretaker dashboard shows a verification request.</desc>
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="419" rx="16" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="30" y="38" font-size="20" font-weight="bold" fill="#2C2C2A">Why the UNO Q exists</text>
<text x="30" y="60" font-size="13" fill="#5F5E5A">Move one wardrobe and the Wi-Fi picture of the room changes. Someone has to notice.</text>

<rect x="30" y="90" width="590" height="270" rx="6" fill="#FAFAF7" stroke="#5F5E5A" stroke-width="3"/>
<rect x="50" y="110" width="140" height="100" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<rect x="62" y="120" width="46" height="24" rx="6" fill="#fff" stroke="#85B7EB"/>
<text x="130" y="170" font-size="13" font-weight="bold" text-anchor="middle" fill="#0C447C">Bed</text>

<line x1="296" y1="126" x2="104" y2="312" stroke="#639922" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"><animate attributeName="stroke" values="#639922;#639922;#EF9F27;#EF9F27;#639922" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite"/></line>
<line x1="304" y1="126" x2="556" y2="312" stroke="#639922" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"><animate attributeName="stroke" values="#639922;#639922;#EF9F27;#EF9F27;#639922" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite"/></line>
<line x1="120" y1="325" x2="540" y2="325" stroke="#639922" stroke-width="2" marker-start="url(#ag)" marker-end="url(#ag)"><animate attributeName="stroke" values="#639922;#639922;#E24B4A;#E24B4A;#639922" keyTimes="0;0.4;0.5;0.9;1" dur="10s" repeatCount="indefinite"/></line>

<rect x="570" y="170" width="36" height="110" rx="4" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="1.5">
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;-250 60;-250 60;0 0" keyTimes="0;0.25;0.4;0.9;1" dur="10s" repeatCount="indefinite"/></rect>
<text x="588" y="292" font-size="12" text-anchor="middle" fill="#5F5E5A"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.25;0.26;0.99;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>Wardrobe</text>

<rect x="282" y="100" width="36" height="26" rx="4" fill="#C23B3A"/><rect x="293" y="105" width="14" height="10" rx="2" fill="#fff" opacity="0.35"/>
<text x="300" y="148" font-size="12" font-weight="bold" text-anchor="middle" fill="#A32D2D">Red</text>
<rect x="82" y="312" width="36" height="26" rx="4" fill="#4C8A1A"/><rect x="93" y="317" width="14" height="10" rx="2" fill="#fff" opacity="0.35"/>
<text x="100" y="352" font-size="12" font-weight="bold" text-anchor="middle" fill="#3B6D11" dy="0">Green</text>
<rect x="542" y="312" width="36" height="26" rx="4" fill="#2F74C0"/><rect x="553" y="317" width="14" height="10" rx="2" fill="#fff" opacity="0.35"/>
<text x="560" y="352" font-size="12" font-weight="bold" text-anchor="middle" fill="#185FA5">Blue</text>

<text x="210" y="298" font-size="12" font-weight="bold" text-anchor="middle" fill="#5F5E5A">
<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.41;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>CSI matches room_v1</text>
<text x="210" y="298" font-size="12" font-weight="bold" text-anchor="middle" fill="#A32D2D" opacity="0">
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/>CSI shifted</text>

<line x1="620" y1="145" x2="648" y2="145" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>
<circle r="4" fill="#185FA5"><animateMotion dur="1.2s" repeatCount="indefinite" path="M620 145 L648 145"/></circle>

<rect x="650" y="100" width="220" height="90" rx="10" fill="#0F6E56"/>
<text x="760" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">Arduino UNO Q</text>
<g font-size="13" text-anchor="middle" fill="#E1F5EE">
<text x="760" y="160" opacity="1">Room matches room_v1<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.4;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="760" y="160" opacity="0">Persistent drift detected<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.4;0.7;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<text x="760" y="160" opacity="0">Asking the caretaker<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
</g>
<line x1="760" y1="192" x2="760" y2="236" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#ag)" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></line>
<rect x="680" y="240" width="160" height="100" rx="10" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="760" y="262" font-size="13" font-weight="bold" text-anchor="middle" fill="#085041">Caretaker dashboard</text>
<rect x="696" y="276" width="128" height="40" rx="6" fill="#FAEEDA" stroke="#BA7517" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></rect>
<text x="760" y="301" font-size="12" font-weight="bold" text-anchor="middle" fill="#633806" opacity="0">Verify room change<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;1" calcMode="discrete" dur="10s" repeatCount="indefinite"/></text>
<rect x="696" y="324" width="80" height="6" rx="3" fill="#9FE1CB"/>

<text x="30" y="392" font-size="13" fill="#444441">It never guesses what moved. It says "possible change" and asks a human.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
