<g font-size="14" font-weight="bold" fill="#2C2C2A">
<text x="48" y="535" opacity="0">1 · Monitoring: room matches room_v1<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.2;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text>
<text x="48" y="535" opacity="0">2 · Persistent drift on several links: possible change<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.2;0.4;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text>
<text x="48" y="535" opacity="0">3 · Caretaker asked to verify the room<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.4;0.6;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text>
<text x="48" y="535" opacity="0">4 · Recalibrating: collecting a stable baseline<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.6;0.8;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text>
<text x="48" y="535" opacity="0">5 · room_v2 saved, room_v1 archived, KNN check pending<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.8;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text>
</g>
<text x="850" y="510" font-size="11" font-weight="bold" text-anchor="end" fill="#5F5E5A">ACTIVE BASELINE</text>
<g font-size="14" font-weight="bold" text-anchor="end" fill="#0C447C">
<text x="850" y="535" opacity="1">room_v1<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.8;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text>
<text x="850" y="535" opacity="0">room_v2<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.8;1" calcMode="discrete" dur="15s" repeatCount="indefinite"/></text>
