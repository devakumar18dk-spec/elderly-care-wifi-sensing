<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Arial, Helvetica, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Room baseline versions stored in SQLite</title>
<desc>room_v1 is active, then a caretaker-confirmed change creates room_v2 which becomes active while room_v1 is archived. room_v3 is a future version.</desc>
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0.5" y="0.5" width="899" height="329" rx="16" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="30" y="38" font-size="20" font-weight="bold" fill="#2C2C2A">Room versions · rollback is always possible</text>
<text x="30" y="60" font-size="13" fill="#5F5E5A">A new baseline never overwrites the old one. It becomes the next version.</text>

<rect x="40" y="90" width="220" height="130" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="150" y="124" font-size="18" font-weight="bold" text-anchor="middle" fill="#0C447C">room_v1</text>
<text x="150" y="150" font-size="13" text-anchor="middle" fill="#185FA5">Initial installation</text>
<text x="150" y="170" font-size="12" text-anchor="middle" fill="#185FA5">Baseline + statistics saved</text>

<rect x="330" y="90" width="220" height="130" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text x="440" y="124" font-size="18" font-weight="bold" text-anchor="middle" fill="#085041">room_v2</text>
<text x="440" y="150" font-size="13" text-anchor="middle" fill="#0F6E56">Furniture moved</text>
<text x="440" y="170" font-size="12" text-anchor="middle" fill="#0F6E56">Caretaker confirmed</text>

<rect x="620" y="90" width="220" height="130" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="730" y="124" font-size="18" font-weight="bold" text-anchor="middle" fill="#444441">room_v3</text>
<text x="730" y="150" font-size="13" text-anchor="middle" fill="#5F5E5A">Future change</text>
<text x="730" y="170" font-size="12" text-anchor="middle" fill="#5F5E5A">Same process again</text>

<line x1="262" y1="155" x2="328" y2="155" stroke="#85B7EB" stroke-width="1.5" marker-end="url(#ab)"/>
<line x1="552" y1="155" x2="618" y2="155" stroke="#B4B2A9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ab)"/>
<circle cy="155" r="5" fill="#185FA5"><animate attributeName="cx" values="262;262;328;328" keyTimes="0;0.35;0.5;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.35;0.5;0.51;1" dur="12s" repeatCount="indefinite"/></circle>

<g font-size="12" font-weight="bold" text-anchor="middle">
<rect x="100" y="196" width="100" height="22" rx="11" fill="#3B6D11" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
<text x="150" y="211" fill="#fff" opacity="1">ACTIVE<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
<rect x="100" y="196" width="100" height="22" rx="11" fill="#888780" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
<text x="150" y="211" fill="#fff" opacity="0">ARCHIVED<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>

<rect x="390" y="196" width="100" height="22" rx="11" fill="#3B6D11" opacity="0"><animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
<text x="440" y="211" fill="#fff" opacity="0">ACTIVE<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>
<rect x="390" y="196" width="100" height="22" rx="11" fill="#B4B2A9" opacity="1"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></rect>
<text x="440" y="211" fill="#fff" opacity="1">PENDING<animate attributeName="opacity" values="1;0;0" keyTimes="0;0.5;1" calcMode="discrete" dur="12s" repeatCount="indefinite"/></text>

<rect x="680" y="196" width="100" height="22" rx="11" fill="#B4B2A9"/>
<text x="730" y="211" fill="#fff">PLANNED</text>
</g>

<path d="M58 258 L58 284 A18 6 0 0 0 94 284 L94 258" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<ellipse cx="76" cy="258" rx="18" ry="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>
<text x="112" y="268" font-size="14" font-weight="bold" fill="#0C447C">SQLite</text>
<text x="112" y="286" font-size="12" fill="#185FA5">Each version keeps its reason, caretaker confirmation, timestamp, links, statistics and validation status.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
