<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" font-family="Arial, Helvetica, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Planned physical setup: ESP32-S3 nodes in the room, UNO Q and caretaker dashboard on the local network</title>
<desc>Top view of a room with a bed, wardrobe, router and three ESP32-S3 nodes. On the local network sit the Arduino UNO Q, a caretaker tablet and the laptop running the Python server.</desc>
<defs>
<clipPath id="room"><rect x="30" y="100" width="570" height="340" rx="6"/></clipPath>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="0.5" y="0.5" width="899" height="509" rx="16" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="30" y="38" font-size="20" font-weight="bold" fill="#2C2C2A">Planned setup · room and local network</text>
<text x="30" y="60" font-size="13" fill="#5F5E5A">Illustrative layout. Real positions are chosen per room and stored with each baseline.</text>
<text x="30" y="90" font-size="12" font-weight="bold" fill="#5F5E5A">ELDERLY-CARE ROOM (TOP VIEW)</text>

<rect x="30" y="100" width="570" height="340" rx="6" fill="#FAFAF7" stroke="#5F5E5A" stroke-width="3"/>

<rect x="60" y="140" width="150" height="120" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<rect x="72" y="150" width="50" height="26" rx="6" fill="#fff" stroke="#85B7EB"/>
<text x="135" y="210" font-size="13" font-weight="bold" text-anchor="middle" fill="#0C447C">Bed</text>

<rect x="548" y="190" width="42" height="120" rx="4" fill="#F1EFE8" stroke="#888780"/>
<text x="588" y="328" font-size="12" text-anchor="end" fill="#5F5E5A">Wardrobe</text>

<g clip-path="url(#room)">
<circle cx="300" cy="119" r="10" fill="none" stroke="#BA7517" stroke-width="1.5"><animate attributeName="r" values="10;44" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="110" cy="413" r="10" fill="none" stroke="#BA7517" stroke-width="1.5"><animate attributeName="r" values="10;44" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
