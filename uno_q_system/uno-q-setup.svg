<text x="725" y="366" font-size="13" font-weight="bold" text-anchor="middle" fill="#085041">Caretaker dashboard</text>

<rect x="665" y="385" width="90" height="40" rx="4" fill="#EEEDFE" stroke="#534AB7"/>
<text x="710" y="410" font-size="12" font-weight="bold" text-anchor="middle" fill="#3C3489">Python</text>
<path d="M655 432 L765 432" stroke="#5F5E5A" stroke-width="3" stroke-linecap="round"/>
<text x="775" y="404" font-size="12" font-weight="bold" fill="#3C3489">Python server</text>
<text x="775" y="420" font-size="12" fill="#5F5E5A">(laptop for now)</text>

<text x="30" y="468" font-size="12" fill="#444441">Amber dashed: router links · Grey: board-to-board links · Blue: local network (Wi-Fi or LAN) · Pulses: Wi-Fi sensing</text>
<text x="30" y="488" font-size="12" fill="#5F5E5A">The UNO Q receives feature windows from the server over HTTP. It is not a sensing node and does not process raw CSI.</text>
