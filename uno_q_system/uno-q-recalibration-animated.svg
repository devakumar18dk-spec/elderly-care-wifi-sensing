<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Arial, Helvetica, sans-serif" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Controlled room recalibration in seven steps</title>
<desc>Animated sequence: preserve, check nodes, wait for stable conditions, collect, validate, version, test the KNN.</desc>
<rect x="0.5" y="0.5" width="899" height="329" rx="16" fill="#FFFFFF" stroke="#D3D1C7"/>
<text x="30" y="38" font-size="20" font-weight="bold" fill="#2C2C2A">Caretaker-approved recalibration</text>
<text x="30" y="60" font-size="13" fill="#5F5E5A">Seven steps, one at a time. The highlight shows the step in progress.</text>

<g stroke="#185FA5" stroke-width="1.5">
<rect x="32" y="84" width="104" height="132" rx="10" fill="#E6F1FB"><animate attributeName="fill" values="#B5D4F4;#E6F1FB;#E6F1FB" keyTimes="0;0.142857;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<rect x="154" y="84" width="104" height="132" rx="10" fill="#E6F1FB"><animate attributeName="fill" values="#E6F1FB;#B5D4F4;#E6F1FB;#E6F1FB" keyTimes="0;0.142857;0.285714;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<rect x="276" y="84" width="104" height="132" rx="10" fill="#E6F1FB"><animate attributeName="fill" values="#E6F1FB;#B5D4F4;#E6F1FB;#E6F1FB" keyTimes="0;0.285714;0.428571;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<rect x="398" y="84" width="104" height="132" rx="10" fill="#E6F1FB"><animate attributeName="fill" values="#E6F1FB;#B5D4F4;#E6F1FB;#E6F1FB" keyTimes="0;0.428571;0.571429;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<rect x="520" y="84" width="104" height="132" rx="10" fill="#E6F1FB"><animate attributeName="fill" values="#E6F1FB;#B5D4F4;#E6F1FB;#E6F1FB" keyTimes="0;0.571429;0.714286;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<rect x="642" y="84" width="104" height="132" rx="10" fill="#E6F1FB"><animate attributeName="fill" values="#E6F1FB;#B5D4F4;#E6F1FB;#E6F1FB" keyTimes="0;0.714286;0.857143;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
<rect x="764" y="84" width="104" height="132" rx="10" fill="#E6F1FB"><animate attributeName="fill" values="#E6F1FB;#B5D4F4;#B5D4F4" keyTimes="0;0.857143;1" calcMode="discrete" dur="14s" repeatCount="indefinite"/></rect>
</g>

<g fill="#0C447C" stroke="none">
<circle cx="48" cy="100" r="10"/><circle cx="170" cy="100" r="10"/><circle cx="292" cy="100" r="10"/><circle cx="414" cy="100" r="10"/><circle cx="536" cy="100" r="10"/><circle cx="658" cy="100" r="10"/><circle cx="780" cy="100" r="10"/>
</g>
<g font-size="11" font-weight="bold" text-anchor="middle" fill="#fff">
<text x="48" y="104">1</text><text x="170" y="104">2</text><text x="292" y="104">3</text><text x="414" y="104">4</text><text x="536" y="104">5</text><text x="658" y="104">6</text><text x="780" y="104">7</text>
</g>

<g fill="none" stroke="#185FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<ellipse cx="84" cy="138" rx="16" ry="5"/><path d="M68 138 L68 158 A16 5 0 0 0 100 158 L100 138"/>
<polygon points="278,126 302,126 290,142"/><polygon points="290,142 278,158 302,158"/>
<polyline points="404,148 412,134 420,158 428,138 436,152 442,146"/>
<circle cx="536" cy="146" r="16"/><path d="M528 146 L534 153 L545 139"/>
<rect x="654" y="132" width="26" height="16" rx="3"/><rect x="664" y="144" width="26" height="16" rx="3" fill="#B5D4F4"/>
<rect x="770" y="146" width="8" height="14" fill="#185FA5"/><rect x="781" y="136" width="8" height="24" fill="#185FA5"/><rect x="792" y="128" width="8" height="32" fill="#185FA5"/>
</g>
<circle cx="188" cy="146" r="7" fill="#C23B3A"/><circle cx="206" cy="146" r="7" fill="#4C8A1A"/><circle cx="224" cy="146" r="7" fill="#2F74C0"/>

<g font-size="14" font-weight="bold" text-anchor="middle" fill="#0C447C">
<text x="84" y="188">Preserve</text><text x="206" y="188">Check nodes</text><text x="328" y="188">Wait stable</text><text x="450" y="188">Collect</text><text x="572" y="188">Validate</text><text x="694" y="188">Version</text><text x="816" y="188">Test KNN</text>
</g>
<g font-size="12" text-anchor="middle" fill="#185FA5">
<text x="84" y="206">Save old state</text><text x="206" y="206">Links alive</text><text x="328" y="206">No movement</text><text x="450" y="206">New windows</text><text x="572" y="206">Stable, complete</text><text x="694" y="206">Save room_v2</text><text x="816" y="206">Labelled check</text>
</g>

<line x1="84" y1="244" x2="816" y2="244" stroke="#B5D4F4" stroke-width="3" stroke-linecap="round"/>
<circle cx="84" cy="244" r="7" fill="#185FA5"><animate attributeName="cx" values="84;206;328;450;572;694;816" keyTimes="0;0.142857;0.285714;0.428571;0.571429;0.714286;0.857143" calcMode="discrete" dur="14s" repeatCount="indefinite"/></circle>

<rect x="30" y="270" width="840" height="36" rx="8" fill="#FCEBEB" stroke="#E24B4A"/>
<text x="450" y="293" font-size="13" font-weight="bold" text-anchor="middle" fill="#791F1F">Unstable baseline? Keep collecting. Never retrain on the model's own unverified predictions.</text>
